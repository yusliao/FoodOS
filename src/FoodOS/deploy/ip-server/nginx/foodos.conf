# FoodOS IP-only staging edge. Host ports are configured in compose.yml.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;
    client_max_body_size 50m;

    location / {
        set $foodos_api api:8080;
        proxy_pass http://$foodos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    location = /config.json {
        alias /etc/nginx/conf.d/admin-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html/dashboard;
    index index.html;

    location = /config.json {
        alias /etc/nginx/conf.d/dashboard-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8083;
    server_name _;
    client_max_body_size 100m;

    location / {
        set $foodos_minio checkpay-minio:9000;
        proxy_pass http://$foodos_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
}
