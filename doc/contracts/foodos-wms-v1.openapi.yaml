openapi: 3.1.0
info:
  title: FoodOS WMS Standard
  version: 1.0.0
  description: >-
    FoodOS 制定的仓储适配标准。仓库方实现出站操作接口；FoodOS 实现入站事件接口。
    WMS 是实物库存、正式预占、质检与仓内执行的唯一权威。FoodOS ID/代码为业务主键，
    仓库外部值通过 warehouse、owner、sku、supplier、store、unit 六类映射维护；单位换算定义为
    foodOsQuantityPerExternalUnit（一个外部单位包含的 FoodOS 基础单位数量）。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{wmsHost}
    description: 仓库方适配器（由仓库方提供）
    variables:
      wmsHost:
        default: wms.invalid
security:
  - HmacSignature: []
tags:
  - name: Warehouse adapter
    description: 仓库方必须实现，供 FoodOS 调用。
  - name: FoodOS inbound
    description: FoodOS 实现，供仓库方回传事实事件。
paths:
  /api/v1/health:
    get:
      summary: 检查仓库适配器健康状态
      tags: [Warehouse adapter]
      operationId: getWmsHealth
      responses:
        '200':
          description: 适配器可接收请求。
        '401': {description: 签名或连接无效。}
  /api/v1/reservations:
    post:
      summary: 正式预占库存
      tags: [Warehouse adapter]
      operationId: reserveInventory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReserveRequest'}
      responses:
        '200': {$ref: '#/components/responses/OperationResult'}
        '409': {$ref: '#/components/responses/OperationResult'}
  /api/v1/reservations/release:
    post:
      summary: 释放正式预占
      tags: [Warehouse adapter]
      operationId: releaseReservation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseRequest'}
      responses:
        '200': {$ref: '#/components/responses/OperationResult'}
        '409': {$ref: '#/components/responses/OperationResult'}
  /api/v1/operations/query:
    post:
      summary: 按原幂等键查询操作最终结果
      tags: [Warehouse adapter]
      operationId: queryOperation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OperationQuery'}
      responses:
        '200': {$ref: '#/components/responses/OperationResult'}
        '404': {$ref: '#/components/responses/OperationResult'}
  /api/v1/inbound-orders:
    post:
      summary: 下发采购入库任务
      tags: [Warehouse adapter]
      operationId: submitInboundOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InboundOrder'}
      responses:
        '200': {$ref: '#/components/responses/OperationResult'}
        '409': {$ref: '#/components/responses/OperationResult'}
  /api/v1/outbound-orders:
    post:
      summary: 下发销售出库任务
      tags: [Warehouse adapter]
      operationId: submitOutboundOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutboundOrder'}
      responses:
        '200': {$ref: '#/components/responses/OperationResult'}
        '409': {$ref: '#/components/responses/OperationResult'}
  /api/v1/outbound-orders/cancel:
    post:
      summary: 申请取消销售出库任务
      tags: [Warehouse adapter]
      operationId: cancelOutboundOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelOutboundOrder'}
      responses:
        '200': {$ref: '#/components/responses/OperationResult'}
        '409': {$ref: '#/components/responses/OperationResult'}
  /api/v1/wms/inbound/events:
    post:
      summary: 向 FoodOS 回传仓储事实事件
      tags: [FoodOS inbound]
      operationId: publishWmsEvent
      servers:
        - url: https://{foodOsHost}
          variables:
            foodOsHost:
              default: api.foodos.invalid
      parameters:
        - name: tenant
          in: header
          required: true
          schema: {type: string, const: root}
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventEnvelope'}
      responses:
        '200':
          description: 已接收、重复或旧版本事件。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventReceipt'}
        '202':
          description: 检测到序列缺口，事件已保存并等待补拉。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventReceipt'}
        '400': {description: 信封或版本无效。}
        '401': {description: 签名、时间窗、连接或租户无效。}
components:
  securitySchemes:
    HmacSignature:
      type: apiKey
      in: header
      name: X-FoodOS-WMS-Signature
      description: 与 X-FoodOS-WMS-Timestamp 共同验证；签名算法见 Signature 参数。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 160}
    Timestamp:
      name: X-FoodOS-WMS-Timestamp
      in: header
      required: true
      description: Unix 秒；默认允许正负 300 秒。
      schema: {type: string, pattern: '^[0-9]+$'}
    Signature:
      name: X-FoodOS-WMS-Signature
      in: header
      required: true
      description: sha256=hex(HMAC-SHA256(secret, UTF8(timestamp + '.') + 原始请求体字节))。
      schema: {type: string, pattern: '^sha256=[0-9a-f]{64}$'}
  responses:
    OperationResult:
      description: >-
        accepted/completed/rejected/unknown。HTTP 超时、429 和 5xx 一律视为 unknown；
        FoodOS 使用同一 Idempotency-Key 查询或重试，不得换键重下。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationResult'}
  schemas:
    QuantityLine:
      type: object
      additionalProperties: false
      required: [lineId, sku, uom, quantity]
      properties:
        lineId: {type: string, maxLength: 80}
        sku: {type: string, maxLength: 100}
        externalSku: {type: [string, 'null'], maxLength: 160}
        uom: {type: string, maxLength: 30}
        externalUom: {type: [string, 'null'], maxLength: 160}
        quantity: {type: number, exclusiveMinimum: 0}
        lotNumber: {type: [string, 'null'], maxLength: 100}
        expiryDate: {type: [string, 'null'], format: date}
    ReserveRequest:
      type: object
      additionalProperties: false
      required: [operationId, orderId, warehouseId, ownerId, lines]
      properties:
        operationId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        expiresAt: {type: [string, 'null'], format: date-time}
        lines: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuantityLine'}}
    ReleaseRequest:
      type: object
      additionalProperties: false
      required: [operationId, reservationId, reason]
      properties:
        operationId: {type: string, format: uuid}
        reservationId: {type: string, maxLength: 160}
        reason: {type: string, maxLength: 200}
    OperationQuery:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: {type: string, maxLength: 200}
    InboundOrder:
      type: object
      additionalProperties: false
      required: [inboundOrderId, purchaseOrderNumber, warehouseId, ownerId, supplierCode, lines]
      properties:
        inboundOrderId: {type: string, format: uuid}
        purchaseOrderNumber: {type: string, maxLength: 100}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        supplierCode: {type: string, maxLength: 100}
        externalSupplierCode: {type: [string, 'null'], maxLength: 160}
        appointmentAt: {type: [string, 'null'], format: date-time}
        lines: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuantityLine'}}
    OutboundOrder:
      type: object
      additionalProperties: false
      required: [outboundOrderId, orderNumber, warehouseId, ownerId, shipBy, consignee, lines]
      properties:
        outboundOrderId: {type: string, format: uuid}
        orderNumber: {type: string, maxLength: 100}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        shipBy: {type: string, format: date-time}
        consignee: {$ref: '#/components/schemas/Consignee'}
        lines: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuantityLine'}}
    Consignee:
      type: object
      additionalProperties: false
      required: [storeId, name, address]
      properties:
        storeId: {type: string, format: uuid}
        externalStoreId: {type: [string, 'null'], maxLength: 160}
        name: {type: string, maxLength: 200}
        address: {type: string, maxLength: 500}
    CancelOutboundOrder:
      type: object
      additionalProperties: false
      required: [operationId, outboundOrderId, reason]
      properties:
        operationId: {type: string, format: uuid}
        outboundOrderId: {type: string, format: uuid}
        reason: {type: string, maxLength: 200}
    OperationResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [accepted, completed, rejected, unknown]}
        externalOperationId: {type: [string, 'null'], maxLength: 160}
        errorCode: {type: [string, 'null'], maxLength: 100}
        detail: {type: [string, 'null'], maxLength: 1000}
        payload: {type: [object, 'null'], additionalProperties: true}
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [messageId, provider, connectionId, eventType, entityType, schemaVersion, externalEventId, externalObjectId, sequence, occurredAt, sentAt, correlationId, idempotencyKey, payload]
      properties:
        messageId: {type: string, format: uuid}
        provider: {type: string, maxLength: 80}
        connectionId: {type: string, maxLength: 120}
        eventType:
          type: string
          enum: [inventory.snapshot, inventory.changed, inbound.received, inbound.qualityCompleted, inbound.putawayCompleted, outbound.allocated, outbound.picked, outbound.shortage, outbound.loaded, outbound.shipped, return.received, inventory.adjusted]
        entityType: {type: string, enum: [inventory, inboundOrder, outboundOrder, return]}
        schemaVersion: {type: string, const: '1.0'}
        externalEventId: {type: string, maxLength: 160}
        externalObjectId: {type: string, maxLength: 160}
        sequence: {type: integer, format: int64, minimum: 1}
        occurredAt: {type: string, format: date-time}
        sentAt: {type: string, format: date-time}
        correlationId: {type: string, maxLength: 160}
        causationId: {type: [string, 'null'], maxLength: 160}
        idempotencyKey: {type: string, maxLength: 200}
        payload:
          oneOf:
            - $ref: '#/components/schemas/InventoryBalanceEventPayload'
            - $ref: '#/components/schemas/InboundReceiptEventPayload'
            - $ref: '#/components/schemas/InboundQualityEventPayload'
            - $ref: '#/components/schemas/InboundPutawayEventPayload'
            - $ref: '#/components/schemas/OutboundProgressEventPayload'
            - $ref: '#/components/schemas/OutboundShortageEventPayload'
            - $ref: '#/components/schemas/ReturnReceivedEventPayload'
    EventQuantityLine:
      type: object
      additionalProperties: false
      required: [lineId, sku, uom, quantity]
      properties:
        lineId: {type: string, maxLength: 80}
        sku: {type: string, maxLength: 100}
        externalSku: {type: [string, 'null'], maxLength: 160}
        uom: {type: string, maxLength: 30}
        externalUom: {type: [string, 'null'], maxLength: 160}
        quantity: {type: number, exclusiveMinimum: 0}
        lotNumber: {type: [string, 'null'], maxLength: 100}
        expiryDate: {type: [string, 'null'], format: date}
        locationCode: {type: [string, 'null'], maxLength: 100}
    PutawayEventLine:
      type: object
      additionalProperties: false
      required: [lineId, sku, uom, quantity, locationCode]
      properties:
        lineId: {type: string, maxLength: 80}
        sku: {type: string, maxLength: 100}
        externalSku: {type: [string, 'null'], maxLength: 160}
        uom: {type: string, maxLength: 30}
        externalUom: {type: [string, 'null'], maxLength: 160}
        quantity: {type: number, exclusiveMinimum: 0}
        lotNumber: {type: [string, 'null'], maxLength: 100}
        expiryDate: {type: [string, 'null'], format: date}
        locationCode: {type: string, maxLength: 100}
    ReturnEventLine:
      type: object
      additionalProperties: false
      required: [lineId, sku, uom, quantity, disposition]
      properties:
        lineId: {type: string, maxLength: 80}
        sku: {type: string, maxLength: 100}
        externalSku: {type: [string, 'null'], maxLength: 160}
        uom: {type: string, maxLength: 30}
        externalUom: {type: [string, 'null'], maxLength: 160}
        quantity: {type: number, exclusiveMinimum: 0}
        lotNumber: {type: [string, 'null'], maxLength: 100}
        expiryDate: {type: [string, 'null'], format: date}
        disposition: {type: string, enum: [quarantine, accepted, rejected]}
    InventoryBalanceEventPayload:
      type: object
      additionalProperties: false
      required: [warehouseId, ownerId, sku, uom, onHandQuantity, allocatedQuantity, availableQuantity, quarantinedQuantity]
      properties:
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        sku: {type: string, maxLength: 100}
        externalSku: {type: [string, 'null'], maxLength: 160}
        uom: {type: string, maxLength: 30}
        externalUom: {type: [string, 'null'], maxLength: 160}
        lotNumber: {type: [string, 'null'], maxLength: 100}
        expiryDate: {type: [string, 'null'], format: date}
        onHandQuantity: {type: number, minimum: 0}
        allocatedQuantity: {type: number, minimum: 0}
        availableQuantity: {type: number, minimum: 0}
        quarantinedQuantity: {type: number, minimum: 0}
        reasonCode: {type: [string, 'null'], maxLength: 100}
    InboundReceiptEventPayload:
      type: object
      additionalProperties: false
      required: [inboundOrderId, warehouseId, ownerId, receivedAt, lines]
      properties:
        inboundOrderId: {type: string, maxLength: 160}
        receiptId: {type: [string, 'null'], maxLength: 160}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        receivedAt: {type: string, format: date-time}
        lines: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/EventQuantityLine'}}
    InboundQualityEventPayload:
      type: object
      additionalProperties: false
      required: [inboundOrderId, warehouseId, ownerId, completedAt, lines]
      properties:
        inboundOrderId: {type: string, maxLength: 160}
        inspectionId: {type: [string, 'null'], maxLength: 160}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        completedAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [lineId, sku, uom, acceptedQuantity, rejectedQuantity]
            properties:
              lineId: {type: string, maxLength: 80}
              sku: {type: string, maxLength: 100}
              externalSku: {type: [string, 'null'], maxLength: 160}
              uom: {type: string, maxLength: 30}
              externalUom: {type: [string, 'null'], maxLength: 160}
              acceptedQuantity: {type: number, minimum: 0}
              rejectedQuantity: {type: number, minimum: 0}
              reasonCode: {type: [string, 'null'], maxLength: 100}
              lotNumber: {type: [string, 'null'], maxLength: 100}
              expiryDate: {type: [string, 'null'], format: date}
    InboundPutawayEventPayload:
      type: object
      additionalProperties: false
      required: [inboundOrderId, warehouseId, ownerId, completedAt, lines]
      properties:
        inboundOrderId: {type: string, maxLength: 160}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        completedAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/PutawayEventLine'}
    OutboundProgressEventPayload:
      type: object
      additionalProperties: false
      required: [outboundOrderId, warehouseId, ownerId, occurredAt, lines]
      properties:
        outboundOrderId: {type: string, maxLength: 160}
        shipmentId: {type: [string, 'null'], maxLength: 160}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        occurredAt: {type: string, format: date-time}
        vehiclePlate: {type: [string, 'null'], maxLength: 40}
        lines: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/EventQuantityLine'}}
    OutboundShortageEventPayload:
      type: object
      additionalProperties: false
      required: [outboundOrderId, warehouseId, ownerId, occurredAt, reasonCode, lines]
      properties:
        outboundOrderId: {type: string, maxLength: 160}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        occurredAt: {type: string, format: date-time}
        reasonCode: {type: string, maxLength: 100}
        lines: {type: array, minItems: 1, maxItems: 500, items: {$ref: '#/components/schemas/EventQuantityLine'}}
    ReturnReceivedEventPayload:
      type: object
      additionalProperties: false
      required: [returnId, outboundOrderId, warehouseId, ownerId, receivedAt, lines]
      properties:
        returnId: {type: string, maxLength: 160}
        outboundOrderId: {type: string, maxLength: 160}
        warehouseId: {type: string, maxLength: 100}
        externalWarehouseId: {type: [string, 'null'], maxLength: 160}
        ownerId: {type: string, maxLength: 160}
        externalOwnerId: {type: [string, 'null'], maxLength: 160}
        receivedAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/ReturnEventLine'}
    EventReceipt:
      type: object
      additionalProperties: false
      required: [messageId, status]
      properties:
        messageId: {type: string, format: uuid}
        status: {type: string, enum: [accepted, duplicate, stale, awaitingGap]}
        lastAcceptedSequence: {type: [integer, 'null'], format: int64}
        detail: {type: [string, 'null']}
